name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Compile covenant
        run: npm run compile
      - name: Unit and integration suites
        run: npm run test:all
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Client secret scan
        run: npm run verify:client-secrets

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Judge path smoke test
        run: npm run test:e2e
