name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Compile covenant
        run: npm run compile
      - name: Covenant VM tests
        run: npm test
      - name: Sandbox engine tests
        run: npm run test:engine
      - name: Covenant address derivation
        run: npm run test:derive
      - name: Live layer tests
        run: npm run test:chain
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build